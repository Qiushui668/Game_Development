<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>糖果风 3D 跑酷 · 正在进入</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
    background:
      radial-gradient(1200px 600px at 15% 0%, #ffe3f2 0%, transparent 60%),
      radial-gradient(900px 500px at 85% 100%, #d9fbf7 0%, transparent 60%),
      #fffafb;
    color: #2b2a28;
  }
  .card {
    width: min(92vw, 460px); background: #fff; border-radius: 20px; padding: 28px 26px 24px;
    box-shadow: 0 18px 50px rgba(255, 63, 139, .16), 0 2px 0 #ffe0ee inset;
    text-align: center;
  }
  h1 { font-size: 22px; margin: 0 0 8px; letter-spacing: .5px; }
  p.sub { margin: 0 0 20px; font-size: 14px; line-height: 1.7; color: #6b6661; }
  .dots { display: inline-flex; gap: 6px; margin-bottom: 18px; }
  .dots i {
    width: 8px; height: 8px; border-radius: 50%; background: #ff3f8b;
    animation: b 1s infinite ease-in-out;
  }
  .dots i:nth-child(2) { background: #2fe6dd; animation-delay: .15s; }
  .dots i:nth-child(3) { background: #7a5cff; animation-delay: .3s; }
  @keyframes b { 0%, 80%, 100% { transform: translateY(0); opacity: .55; } 40% { transform: translateY(-5px); opacity: 1; } }
  a.go {
    display: inline-block; padding: 12px 26px; border-radius: 999px; text-decoration: none;
    font-weight: 800; font-size: 15px; color: #fff;
    background: linear-gradient(135deg, #ff3f8b, #7a5cff 60%, #2fe6dd);
    box-shadow: 0 8px 22px rgba(255, 63, 139, .3);
  }
  a.go[hidden] { display: none; }
  .msg { margin-top: 14px; font-size: 13px; color: #b42318; min-height: 18px; }
  .note { margin-top: 18px; font-size: 12px; line-height: 1.7; color: #8a8078; }
  code { font-family: ui-monospace, Consolas, monospace; background: #f6f4f1; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
  <div class="card">
    <div class="dots"><i></i><i></i><i></i></div>
    <h1>正在进入糖果风 3D 跑酷</h1>
    <p class="sub">入口固定在这个域名；实际游戏跑在当天的隧道地址上，页面会自动跳过去。</p>
    <a id="go" class="go" href="#" hidden>立即进入</a>
    <div id="msg" class="msg"></div>
    <div class="note">
      打不开多半是主持人的电脑没开（服务随那台机器走）。<br />
      跳转文件：<code>target.txt</code>
    </div>
  </div>

<script>
  const go = document.getElementById('go');
  const msg = document.getElementById('msg');

  (async () => {
    try {
      const res = await fetch('target.txt?t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error('target.txt ' + res.status);
      const url = (await res.text()).replace(/\uFEFF/g, '').trim();
      if (!/^https?:\/\/\S+$/i.test(url)) throw new Error('target.txt 内容不是网址');
      go.href = url;
      go.hidden = false;
      setTimeout(() => location.replace(url), 900);
    } catch (err) {
      msg.textContent = '入口暂时不可用：' + err.message + '（主持人可能没启动服务）';
    }
  })();
</script>
</body>
</html>
